name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a change on mcpcheck's main branch or in the runner image that
  # breaks the action shows up here before the next release does.
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  build-mcpcheck:
    name: build mcpcheck from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rajanaggarwal11/mcpcheck
          path: mcpcheck
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: mcpcheck/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: |
          cd mcpcheck
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p "$RUNNER_TEMP/out"
          pnpm pack --pack-destination "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpcheck-tgz
          path: ${{ runner.temp }}/out/*.tgz

  finds-problems:
    name: reports a server with known problems
    runs-on: ubuntu-latest
    needs: build-mcpcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpcheck-tgz
          path: ${{ runner.temp }}/mcpcheck
      - id: tgz
        shell: bash
        run: echo "path=$(ls "$RUNNER_TEMP"/mcpcheck/*.tgz)" >> "$GITHUB_OUTPUT"
      - id: check
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          server: node test/fixture/bad-server.mjs
          snapshot: ""
          fail-on-findings: false
      - name: the fixture has three error-severity problems and one warning
        shell: bash
        env:
          SERVER: ${{ steps.check.outputs.server }}
          TOOLS: ${{ steps.check.outputs.tools }}
          ERRORS: ${{ steps.check.outputs.errors }}
          WARNINGS: ${{ steps.check.outputs.warnings }}
        run: |
          echo "server=$SERVER tools=$TOOLS errors=$ERRORS warnings=$WARNINGS"
          [ "$TOOLS" = "4" ] || { echo "expected 4 tools"; exit 1; }
          [ "$ERRORS" -ge 3 ] || { echo "expected at least 3 errors"; exit 1; }
          [ "$WARNINGS" -ge 1 ] || { echo "expected a warning (ping has no annotations)"; exit 1; }

  fails-the-build:
    name: fails when findings remain
    runs-on: ubuntu-latest
    needs: build-mcpcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpcheck-tgz
          path: ${{ runner.temp }}/mcpcheck
      - id: tgz
        shell: bash
        run: echo "path=$(ls "$RUNNER_TEMP"/mcpcheck/*.tgz)" >> "$GITHUB_OUTPUT"
      - id: check
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          server: node test/fixture/bad-server.mjs
          snapshot: ""
      - name: the default must block on an error-severity finding
        shell: bash
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ] || {
            echo "expected the step to fail, got $OUTCOME"; exit 1; }

  clean-server:
    name: passes a clean reference server
    runs-on: ubuntu-latest
    needs: build-mcpcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpcheck-tgz
          path: ${{ runner.temp }}/mcpcheck
      - id: tgz
        shell: bash
        run: echo "path=$(ls "$RUNNER_TEMP"/mcpcheck/*.tgz)" >> "$GITHUB_OUTPUT"
      - id: check
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          server: npx -y @modelcontextprotocol/server-memory@2.2.1
          snapshot: ""
      - shell: bash
        env:
          TOTAL: ${{ steps.check.outputs.total }}
        run: |
          [ "$TOTAL" = "0" ] || {
            echo "expected no findings on server-memory, got $TOTAL"; exit 1; }

  scoping-works:
    name: --only narrows the run
    runs-on: ubuntu-latest
    needs: build-mcpcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpcheck-tgz
          path: ${{ runner.temp }}/mcpcheck
      - id: tgz
        shell: bash
        run: echo "path=$(ls "$RUNNER_TEMP"/mcpcheck/*.tgz)" >> "$GITHUB_OUTPUT"
      - id: check
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          server: node test/fixture/bad-server.mjs
          snapshot: ""
          only: over-broad-tool
          fail-on-findings: false
      - shell: bash
        env:
          TOTAL: ${{ steps.check.outputs.total }}
        run: |
          [ "$TOTAL" = "1" ] || {
            echo "expected exactly run_shell, got $TOTAL"; exit 1; }

  cannot-run-is-exit-2:
    name: a server that dies is a failed step, not a clean one
    runs-on: ubuntu-latest
    needs: build-mcpcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpcheck-tgz
          path: ${{ runner.temp }}/mcpcheck
      - id: tgz
        shell: bash
        run: echo "path=$(ls "$RUNNER_TEMP"/mcpcheck/*.tgz)" >> "$GITHUB_OUTPUT"
      - id: check
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          server: node -e process.exit(3)
          snapshot: ""
          fail-on-findings: false
      - shell: bash
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ] || {
            echo "fail-on-findings: false must not hide a server that could not be inspected"; exit 1; }

  report-is-safe:
    name: a hostile report cannot forge outputs or inject markup into the summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - shell: bash
        run: node test/check-report.mjs

  hostile-server:
    name: a server name with newlines does not forge the step's outputs
    runs-on: ubuntu-latest
    needs: build-mcpcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpcheck-tgz
          path: ${{ runner.temp }}/mcpcheck
      - id: tgz
        shell: bash
        run: echo "path=$(ls "$RUNNER_TEMP"/mcpcheck/*.tgz)" >> "$GITHUB_OUTPUT"
      - id: check
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          server: env HOSTILE=1 node test/fixture/bad-server.mjs
          snapshot: ""
          fail-on-findings: false
      - shell: bash
        env:
          SERVER: ${{ steps.check.outputs.server }}
          TOTAL: ${{ steps.check.outputs.total }}
          ERRORS: ${{ steps.check.outputs.errors }}
          WARNINGS: ${{ steps.check.outputs.warnings }}
        run: |
          printf 'server=%q total=%s errors=%s warnings=%s\n' "$SERVER" "$TOTAL" "$ERRORS" "$WARNINGS"
          [ "$ERRORS" -ge 3 ] || { echo "errors was forged to $ERRORS"; exit 1; }
          [ "$WARNINGS" -ge 1 ] || { echo "warnings was forged to $WARNINGS"; exit 1; }
          [ "$TOTAL" -ge 4 ] || { echo "total was forged to $TOTAL"; exit 1; }
          case "$SERVER" in
            *$'\n'*|*$'\r'*) echo "the server output spans lines"; exit 1 ;;
            evil*) ;;
            *) echo "unexpected server output"; exit 1 ;;
          esac
